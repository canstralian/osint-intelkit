version: "3.9"

services:
  api:
    build: ./backend
    container_name: osint_api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - neo4j
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: osint_worker
    env_file: .env
    depends_on:
      - postgres
      - neo4j
    volumes:
      - ./backend:/app
    command: python -m app.workers.collector
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: prefect_server
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      - PREFECT_API_DATABASE_CONNECTION_URL=sqlite+aiosqlite:////root/.prefect/prefect.db
      - PREFECT_SERVER_API_HOST=0.0.0.0
    volumes:
      - prefect_data:/root/.prefect
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  prefect-agent:
    image: prefecthq/prefect:3-latest
    container_name: prefect_agent
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
    depends_on:
      prefect-server:
        condition: service_healthy
    command: prefect agent start --pool default-agent-pool --work-queue default
    restart: unless-stopped

  deployment:
    build: ./backend
    container_name: osint_deployment
    env_file: .env
    depends_on:
      prefect-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend:/app
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
    command: python -m app.flows.deploy
    restart: on-failure

  postgres:
    image: postgres:16
    container_name: osint_postgres
    environment:
      POSTGRES_DB: osintdb
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: osintpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osint"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: osint_neo4j
    environment:
      NEO4J_AUTH: neo4j/testpass
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p testpass 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  neo4jdata:
  prefect_data:
